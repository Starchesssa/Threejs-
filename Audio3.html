<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curvy Neo-Brutalist Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #121212;
  --panel: #FFFFFF;
  --accent-1: #ADFF2F; /* Electric Lime */
  --accent-2: #FF00E5; /* Hot Pink */
  --accent-3: #00F0FF; /* Cyan */
  --border-thick: 4px solid #000;
  --brutalist-shadow: 8px 8px 0px #000;
}

body {
  margin: 0;
  background-color: var(--accent-1);
  background-image: radial-gradient(#000 1.5px, transparent 1.5px);
  background-size: 30px 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Space Grotesk', sans-serif;
}

/* --- THE MAIN CARD --- */
.player-card {
  width: 380px;
  background: var(--panel);
  border: var(--border-thick);
  box-shadow: 12px 12px 0px #000;
  border-radius: 40px; /* CURVY BODY */
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* --- THE MODERN VISUALIZER --- */
.vis-screen {
  background: #000;
  height: 160px;
  border-radius: 30px; /* CURVY SCREEN */
  border: var(--border-thick);
  position: relative;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
}

/* --- TRACK INFO --- */
.track-meta {
  text-align: center;
}

.song-name {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  text-transform: uppercase;
  margin: 0;
  line-height: 1;
}

.artist-name {
  font-size: 14px;
  font-weight: 700;
  opacity: 0.6;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* --- CONTROLS: EDGY + CURVY MIX --- */
.controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.play-btn {
  width: 80px;
  height: 80px;
  background: var(--accent-2);
  border: var(--border-thick);
  border-radius: 50%; /* FULLY CURVY */
  cursor: pointer;
  box-shadow: 6px 6px 0px #000; /* SHARP SHADOW */
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.1s;
}

.play-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0px 0px 0px #000;
}

.nav-btn {
  flex: 1;
  padding: 15px;
  background: var(--accent-3);
  border: var(--border-thick);
  border-radius: 15px; /* SEMI CURVY */
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 4px 4px 0px #000;
  transition: 0.1s;
}

.nav-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0px #000;
}

/* --- CUSTOM RANGE SLIDER --- */
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  background: transparent;
}

input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 12px;
  background: #000;
  border-radius: 10px;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 28px;
  width: 28px;
  background: var(--accent-1);
  border: 3px solid #000;
  border-radius: 8px; /* EDGY THUMB */
  margin-top: -10px;
  cursor: pointer;
  box-shadow: 3px 3px 0px #000;
}
</style>
</head>
<body>

<div class="player-card">
  <div class="vis-screen">
    <canvas id="canvas"></canvas>
  </div>

  <div class="track-meta">
    <h1 class="song-name">Ultra-Neon</h1>
    <span class="artist-name">Digital Architect</span>
  </div>

  <input type="range" id="progress" value="0" max="100">

  <div class="controls-row">
    <button class="nav-btn">PREV</button>
    <button class="play-btn" id="playBtn">
      <svg id="playIcon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <svg id="pauseIcon" style="display:none" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>
    <button class="nav-btn">NEXT</button>
  </div>

  <audio id="audio" crossorigin="anonymous" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
</div>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let audioCtx, analyser, source, dataArray;
let initialized = false;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  analyser.fftSize = 64; 
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  initialized = true;
  animate();
}

playBtn.addEventListener('click', () => {
  if (!initialized) initAudio();
  if (audio.paused) {
    audio.play();
    document.getElementById('playIcon').style.display = 'none';
    document.getElementById('pauseIcon').style.display = 'block';
  } else {
    audio.pause();
    document.getElementById('playIcon').style.display = 'block';
    document.getElementById('pauseIcon').style.display = 'none';
  }
});

function animate() {
  requestAnimationFrame(animate);
  analyser.getByteFrequencyData(dataArray);

  ctx.fillStyle = '#000'; // Black background
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const barWidth = (canvas.width / dataArray.length) * 2;
  let x = 0;

  for (let i = 0; i < dataArray.length; i++) {
    const val = dataArray[i];
    // Modern "Pill" effect: height grows from center
    const height = (val / 255) * canvas.height * 0.8;
    const y = (canvas.height - height) / 2;

    // Color shifting based on frequency
    ctx.fillStyle = i % 2 === 0 ? '#ADFF2F' : '#00F0FF';
    
    // Draw rounded capsules (modern visualizer look)
    drawRoundedRect(ctx, x, y, barWidth - 4, height, 10);

    x += barWidth;
  }
}

// Helper function for curvy visualizer bars
function drawRoundedRect(ctx, x, y, width, height, radius) {
  if (height < 5) return; // Don't draw tiny dots
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.fill();
}
</script>

</body>
</html>
