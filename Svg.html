<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Comfort Zone Circle Animation */
      #comfort-zone-circle {
        stroke: #aaa;
        stroke-dasharray: 10 5;
        fill: none;
        stroke-width: 3;
        animation: circleControl 12s infinite;
      }
      @keyframes circleControl {
        0%, 33% { opacity: 1; transform: scale(1); transform-origin: 200px 180px;}
        34%, 45% { opacity: 0; transform: scale(1.5); }
        46%, 100% { opacity: 0; transform: scale(1.5); }
      }

      /* Wilting Plant */
      #wilted-plant {
        fill: #a1887f;
        animation: wiltControl 12s infinite;
      }
      @keyframes wiltControl {
        0%, 33% { opacity: 1; }
        34%, 100% { opacity: 0; }
      }

      /* Healthy Plant */
      #healthy-plant {
        fill: #4CAF50;
        animation: healthyControl 12s infinite;
        transform-origin: 200px 240px;
      }
      @keyframes healthyControl {
        0%, 33% { opacity: 0; transform: scaleY(0.5); }
        45%, 80% { opacity: 1; transform: scaleY(1); }
        81%, 100% { opacity: 0; transform: scaleY(0.5); }
      }

      /* Flower Bloom */
      #flower {
        fill: #FFC107;
        stroke: #F57F17;
        animation: flowerBloom 12s infinite;
        transform-origin: 200px 130px;
      }
      @keyframes flowerBloom {
        0%, 40% { transform: scale(0); opacity: 0; }
        50%, 80% { transform: scale(1); opacity: 1; }
        81%, 100% { transform: scale(0); opacity: 0; }
      }

      /* Sun */
      #sun {
        fill: #FFEB3B;
        animation: sunAppear 12s infinite;
      }
      @keyframes sunAppear {
        0%, 45% { opacity: 0; transform: translate(10px,-10px) scale(0.5); transform-origin: 330px 60px; }
        55%, 80% { opacity: 1; transform: translate(0,0) scale(1); }
        81%, 100% { opacity: 0; transform: translate(10px,-10px) scale(0.5); }
      }

      /* Text Animations */
      .text {
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        text-anchor: middle;
        fill: #555;
        opacity: 0;
        animation: textFade 12s infinite;
      }
      #text-2 { animation-delay: 4s; }
      #text-3 { animation-delay: 8s; fill: #1a237e; }

      @keyframes textFade {
        5%, 30% { opacity: 1; }
        0%, 4%, 31%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#e3f2fd" />

  <!-- Sun -->
  <g id="sun">
    <circle cx="330" cy="60" r="30"/>
    <line x1="330" y1="15" x2="330" y2="0" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="330" y1="105" x2="330" y2="120" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="285" y1="60" x2="270" y2="60" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="375" y1="60" x2="390" y2="60" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="300" y1="30" x2="290" y2="20" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="360" y1="90" x2="370" y2="100" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="360" y1="30" x2="370" y2="20" stroke="#FFEB3B" stroke-width="3"/>
    <line x1="300" y1="90" x2="290" y2="100" stroke="#FFEB3B" stroke-width="3"/>
  </g>

  <!-- Comfort Zone Circle -->
  <circle id="comfort-zone-circle" cx="200" cy="180" r="80"/>

  <!-- Plant Pot -->
  <path d="M170 240 L180 260 H220 L230 240 Z" fill="#D2691E"/>

  <!-- Wilting Plant -->
  <g id="wilted-plant">
    <path d="M200 240 Q210 200, 205 160" stroke="#a1887f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M205 190 Q225 195, 230 210 Q215 200, 205 190 Z"/>
  </g>

  <!-- Healthy Plant -->
  <g id="healthy-plant">
    <path d="M200 240 V 130" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200 180 Q230 170, 240 190 Q220 185, 200 180 Z"/>
    <path d="M200 200 Q170 190, 160 210 Q180 205, 200 200 Z"/>
  </g>

  <!-- Flower -->
  <g id="flower" transform="translate(200,130)">
    <circle r="15" fill="#8B4513"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(0)"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(60)"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(120)"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(180)"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(240)"/>
    <path d="M0-15 A20 20 0 0 1 0-15 Z" transform="rotate(300)"/>
  </g>

  <!-- Texts -->
  <text x="200" y="40" class="text" id="text-1">The comfort zone is what kills you...</text>
  <text x="200" y="40" class="text" id="text-2">...becoming comfortable with bad habits.</text>
  <text x="200" y="40" class="text" id="text-3">Be comfortable in the GOOD ZONE.</text>

      </svg>
