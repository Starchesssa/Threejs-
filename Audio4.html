<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neobrutalist Audio Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #e0e0e0;
  --card-bg: #fff;
  --accent: #6949FF;
  --border: 3px solid #000;
  --shadow: 8px 8px 0px #000;
}

body {
  margin: 0;
  background-color: var(--bg-color);
  background-image: 
    linear-gradient(#000 1px, transparent 1px),
    linear-gradient(90deg, #000 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Space Mono', monospace;
}

.player {
  width: 360px;
  background: var(--card-bg);
  border: var(--border);
  padding: 20px;
  box-shadow: var(--shadow);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.header {
  display: flex;
  justify-content: space-between;
  border-bottom: var(--border);
  padding-bottom: 10px;
  margin-bottom: 5px;
}
.brand { font-weight: 700; text-transform: uppercase; letter-spacing: -1px; }
.status { background: #000; color: #fff; padding: 0 5px; font-size: 12px; }

.screen-container {
  background: #fdfdfd;
  border: var(--border);
  height: 140px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.screen-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
  background-size: 100% 4px;
  pointer-events: none;
}

.controls {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  background: var(--accent);
  color: white;
  border: var(--border);
  padding: 15px;
  font-family: 'Archivo', sans-serif;
  font-size: 18px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 4px 4px 0px #000;
  transition: transform 0.1s, box-shadow 0.1s;
}

button:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px #000;
}

button.secondary {
  background: #fff;
  color: #000;
  flex: 0.5;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  background: transparent;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  border: var(--border);
  height: 20px;
  width: 20px;
  background: #000;
  cursor: pointer;
  margin-top: -8px;
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 4px;
  background: #000;
}
</style>
</head>
<body>

<div class="player">
  <div class="header">
    <div class="brand">AudioOS v2.0</div>
    <div class="status" id="status-text">READY</div>
  </div>

  <div class="screen-container">
    <canvas id="visualizer"></canvas>
    <div class="screen-overlay"></div>
  </div>

  <audio id="audio" crossorigin="anonymous" src="https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3"></audio>

  <div class="info">
    <div style="font-weight:bold; font-size: 14px;">NEON NIGHTS</div>
    <div style="font-size: 12px; color: #555;">Cyberpunk Mix</div>
  </div>

  <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">

  <div class="controls">
    <button class="secondary">⏮</button>
    <button id="playBtn">PLAY</button>
    <button class="secondary">⏭</button>
  </div>
</div>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const volumeSlider = document.getElementById('volume');
const statusText = document.getElementById('status-text');

let audioContext, analyser, source;
let isContextSetup = false;

function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setupAudioContext() {
  if (isContextSetup) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioContext = new AudioContext();
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 128; // more bars
  source = audioContext.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioContext.destination);
  isContextSetup = true;
}

function draw() {
  requestAnimationFrame(draw);
  if (!analyser) return;

  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  ctx.fillStyle = '#fdfdfd';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const barWidth = (canvas.width / bufferLength) * 1.5;
  let x = 0;

  // Draw waveform line behind bars
  ctx.beginPath();
  ctx.strokeStyle = '#6949FF';
  ctx.lineWidth = 2;
  for (let i = 0; i < bufferLength; i++) {
    const y = canvas.height - (dataArray[i] / 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += barWidth + 2;
  }
  ctx.stroke();

  // Reset x for bars
  x = 0;

  for (let i = 0; i < bufferLength; i++) {
    let barHeight = dataArray[i] * 1.2;

    const gradient = ctx.createLinearGradient(0, canvas.height - barHeight, 0, canvas.height);
    gradient.addColorStop(0, '#6949FF');
    gradient.addColorStop(0.5, '#FF6B6B');
    gradient.addColorStop(1, '#000');

    ctx.shadowColor = '#6949FF';
    ctx.shadowBlur = 15;

    ctx.fillStyle = gradient;
    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, canvas.height - barHeight, barWidth, barHeight);

    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(x, canvas.height - barHeight - 10, barWidth, 10);

    x += barWidth + 2;
  }
  ctx.shadowBlur = 0;
}

playBtn.addEventListener('click', () => {
  if (!isContextSetup) {
    setupAudioContext();
    draw();
  }
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  if (audio.paused) {
    audio.play();
    playBtn.innerText = "PAUSE";
    playBtn.style.background = "#FF6B6B";
    statusText.innerText = "PLAYING >>";
    statusText.style.background = "#FF6B6B"; 
  } else {
    audio.pause();
    playBtn.innerText = "PLAY";
    playBtn.style.background = "#6949FF";
    statusText.innerText = "PAUSED ||";
    statusText.style.background = "#000"; 
  }
});

volumeSlider.addEventListener('input', (e) => {
