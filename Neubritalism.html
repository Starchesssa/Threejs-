<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo-Brutalism Sample</title>

<!-- Font Awesome for icons -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<style>
/* ---- Global ---- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: #1f1f1f; /* dark industrial base */
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ---- Background neon gradients ---- */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 30%, #ff4f81, transparent 40%),
              radial-gradient(circle at 80% 70%, #00f5d4, transparent 40%);
  z-index: -1;
  opacity: 0.2;
}

/* ---- Brutal Panel ---- */
.brutal-panel {
  border: 6px solid #fff;
  background: #2c2c2c;
  width: 360px;
  padding: 28px;
  margin: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s ease, background 0.25s ease;
}

/* Hover effect: punchy brutalist feel */
.brutal-panel:hover {
  transform: translateY(-12px) rotate(-1deg);
  background: #3a3a3a;
  border-color: #ff4f81;
}

/* ---- Titles ---- */
.title {
  font-size: 2.4rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

.accent {
  color: #00f5d4;
  font-weight: 900;
}

/* ---- Description ---- */
.description {
  font-size: 1rem;
  color: #ddd;
  margin-bottom: 24px;
}

/* ---- Icon Buttons ---- */
.icon-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 12px;
}

.icon-row i {
  font-size: 1.7rem;
  color: #fff;
  border: 3px solid #fff;
  padding: 16px;
  border-radius: 6px;
  transition: all 0.25s ease;
  cursor: pointer;
  background: #2c2c2c;
}

.icon-row i:hover {
  transform: rotate(-15deg) scale(1.25);
  background: #ff4f81;
  color: #fff;
  border-color: #00f5d4;
}

/* ---- Accent block for extra brutalist feel ---- */
.accent-block {
  width: 60px;
  height: 6px;
  background: #ff4f81;
  margin: 12px auto;
  transform: skew(-15deg);
}
</style>
</head>
<body>

  <div class="brutal-panel">
    <h1 class="title">Neo-<span class="accent">Brutalism</span></h1>
    <div class="accent-block"></div>
    <p class="description">
      Edgy, raw, high-contrast, and bold UI style. Sharp panels, neon accents, and geometric structure.
    </p>

    <div class="icon-row">
      <i class="fas fa-star"></i>
      <i class="fas fa-lightbulb"></i>
      <i class="fas fa-rocket"></i>
    </div>
  </div>

</body>
</html>
